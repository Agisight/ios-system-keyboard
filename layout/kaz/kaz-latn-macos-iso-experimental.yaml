# Experimental macOS ISO layout for Kazakh Latin.
#
# Base letter placement follows the public QWERTY keyboard scheme shown in
# materials from the 2021 Kazakh Latin alphabet reform discussion:
# https://primeminister.kz/ru/news/a-mamin-provel-zasedanie-nackomissii-po-perevodu-alfavita-kazahskogo-yazyka-na-latinicu-280497
#
# A later April 2021 revision reported by ARNA News uses Ñ/ñ instead of the
# earlier Ŋ/ŋ form:
# https://arna-news.kz/arna_kz/chto-izmenilos-v-novom-variante-alfavita-kazahskogo-jazyka-na-latinice/
#
# Experimental: not a finalized or standardized production layout.
#
# This is the primary desktop geometry for the experiment. It maps the source
# 12/12/10 Kazakh letter rows onto an ISO keyboard by using the extra ISO key
# before Z for backslash / vertical bar.
#
# Kazakh-specific casing:
#   I / ı
#   İ / i

displayNames:
  en: Kazakh Latin (ISO, experimental)
  ru: Казахский (латиница, ISO, экспериментальная)
  kaz: Қазақша (латын, ISO, эксперименттік)

label: 'ISO · Experimental'
separateMacOS: true
geometry: ISO
recommended: true

decimal: ','

macOS:
  primary:
    layers:
      default: |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          q w e r t y u ı o p ö ñ
          a s d f g h j k l ş i ü
          \ z x c v b n m ğ ū ä

      shift: &SHIFT |
        ~ ! @ # $ % ^ & * ( ) _ +
          Q W E R T Y U I O P Ö Ñ
          A S D F G H J K L Ş İ Ü
          | Z X C V B N M Ğ Ū Ä

      caps: |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          Q W E R T Y U I O P Ö Ñ
          A S D F G H J K L Ş İ Ü
          \ Z X C V B N M Ğ Ū Ä

      caps+shift: *SHIFT

      alt: &ALT |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          q w e r t y u ı o p ö ñ
          a s d f g h j k l ş i ü
          \ z x c v b n m ğ ū ä

      alt+shift: |
        ~ ! @ # $ % ^ & * ( ) _ +
          Q W E R T Y U I O P Ö Ñ
          A S D F G H J K L Ş İ Ü
          | Z X C V B N M Ğ Ū Ä

      alt+caps: *ALT

      # Command-modified layers use Latin physical outputs for common shortcuts.
      # Row lengths intentionally follow ISO geometry: 13 / 12 / 12 / 11.
      cmd: &CMD |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          q w e r t y u i o p [ ]
          a s d f g h j k l ; ' \
          \ z x c v b n m , . /

      cmd+shift: &CMD_SHIFT |
        ~ ! @ # $ % ^ & * ( ) _ +
          Q W E R T Y U I O P { }
          A S D F G H J K L : " |
          | Z X C V B N M < > ?

      cmd+alt: *CMD
      cmd+alt+shift: *CMD_SHIFT

  deadKeys:
    alt: []
    alt+caps: []
