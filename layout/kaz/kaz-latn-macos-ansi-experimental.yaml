# Experimental macOS ANSI adaptation for Kazakh Latin.
#
# Canonical experimental letter order:
#
#   Q W E R T Y U I O P Ö Ñ
#   A S D F G H J K L Ş İ Ü
#   Z X C V B N M Ğ Ū Ä
#
# ANSI has 13 / 11 / 10 physical character positions on the three letter rows,
# while the source scheme needs 12 / 12 / 10 letters. To preserve reading order
# with no missing letters, Ü/ü moves to the ANSI backslash-key position at the
# far right of the QWERTY row. Backslash and vertical bar remain available on
# that same physical key through Option / Option+Shift.
#
# Optional adaptation; not a finalized or standardized production layout.

displayNames:
  en: Kazakh Latin (ANSI, experimental)
  ru: Казахский (латиница, ANSI, экспериментальная)
  kaz: Қазақша (латын, ANSI, эксперименттік)

label: 'ANSI · Experimental'
separateMacOS: true
geometry: ANSI
recommended: false

decimal: ','

macOS:
  primary:
    layers:
      default: |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          q w e r t y u ı o p ö ñ ü
          a s d f g h j k l ş i
          z x c v b n m ğ ū ä

      shift: &SHIFT |
        ~ ! @ # $ % ^ & * ( ) _ +
          Q W E R T Y U I O P Ö Ñ Ü
          A S D F G H J K L Ş İ
          Z X C V B N M Ğ Ū Ä

      caps: |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          Q W E R T Y U I O P Ö Ñ Ü
          A S D F G H J K L Ş İ
          Z X C V B N M Ğ Ū Ä

      caps+shift: *SHIFT

      # Option on the physical ANSI backslash key restores backslash / pipe.
      alt: &ALT |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          q w e r t y u ı o p ö ñ \
          a s d f g h j k l ş i
          z x c v b n m ğ ū ä

      alt+shift: |
        ~ ! @ # $ % ^ & * ( ) _ +
          Q W E R T Y U I O P Ö Ñ |
          A S D F G H J K L Ş İ
          Z X C V B N M Ğ Ū Ä

      alt+caps: *ALT

      # Standard ANSI Latin physical outputs keep Command shortcuts predictable.
      cmd: &CMD |
        ` 1 2 3 4 5 6 7 8 9 0 - =
          q w e r t y u i o p [ ] \
          a s d f g h j k l ; '
          z x c v b n m , . /

      cmd+shift: &CMD_SHIFT |
        ~ ! @ # $ % ^ & * ( ) _ +
          Q W E R T Y U I O P { } |
          A S D F G H J K L : "
          Z X C V B N M < > ?

      cmd+alt: *CMD
      cmd+alt+shift: *CMD_SHIFT

  deadKeys:
    alt: []
    alt+caps: []
