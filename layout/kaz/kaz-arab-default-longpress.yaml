# kaz-arab-default-longpress.yaml
# Долгое нажатие для раскладок Default и Default Touch: ا → ف + пунктуация

ا: ['ف']

# Символы и пунктуация
'.': ['…']
'؟': ['?', '¿']
'!': ['¡']
'0': ['°']
'-': ['–', '—', '•']
'%': ['‰']
'=': ['≠', '≈']
'(': ['[', '{']
')': [']', '}']
'"': ['”', '“', '„']
'&': ['§']
'/': ["\\"]
