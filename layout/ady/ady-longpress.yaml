# West Circassian (Adyghe) long-press.
# Every Adyghe letter beyond the Russian alphabet is a digraph (base letter + ъ, ь or ӏ).
# ъ and ӏ are on the visible layer, so digraphs can always be typed letter by letter;
# long-press only offers them as a shortcut. Order follows corpus frequency
# (rf-keyboard-corpora/data/ady/adiga.ai/frequencies), most frequent first.
к: кӏ къ
К: Кӏ Къ
г: гъ
Г: Гъ
ж: жь жъ
Ж: Жь Жъ
л: лъ лӏ
Л: Лъ Лӏ
п: пӏ
П: Пӏ
т: тӏ
Т: Тӏ
х: хь хъ
Х: Хь Хъ
ц: цӏ
Ц: Цӏ
ч: чӏ чъ
Ч: Чӏ Чъ
ш: шӏ шъ
Ш: Шӏ Шъ
д: дж дз
Д: Дж Дз
е: ё
Е: Ё

# Punctuation / symbol alternates (same as Russian)
'0': '°'
₽: '$ € £ ¥ ￦'
'#': №
'.': '…'
'%': '‰ ∞'
'=': '≠ ≈'
'-': '• – —'
'/': '\'
'&': §
'?': ¿
'!': ¡
'’': "' ’ ‘ `"
'“': '" ” “ „ » «'
