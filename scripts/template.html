<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){document.write('<style id="mob">.iphone{width:100%!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}.iphone::before,.iphone::after,.di,.home-ind,.sbar{display:none!important}.screen{border-radius:0!important;height:100dvh!important}body{padding:0!important;background:#f2f2f7!important}body::before{display:none!important}</style>')}</script>
<title>iOS Keyboard Explorer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#007aff;--bg:#1c1c1e;
  --text:#1c1c1e;--text2:#6c6c70;--text3:#aeaeb2;
  --sep:rgba(0,0,0,.1);--font:-apple-system,'Helvetica Neue',sans-serif;
  --mono:'SF Mono','Menlo',monospace;
}
body{font-family:var(--font);background:#1c1c1e;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:72px 16px 48px;overflow-y:auto}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#2d2d3a 0%,#1c1c1e 60%);z-index:-1}

@media (max-width:768px){
  body{padding:0!important;background:#f2f2f7!important;align-items:stretch!important}
  body::before{display:none!important}
  .iphone{width:100%!important;border-radius:0!important;padding:0!important;background:transparent!important;box-shadow:none!important}
  .iphone::before,.iphone::after{display:none!important}
  .di{display:none!important}
  .screen{border-radius:0!important;height:calc(100dvh - 8px)!important;margin-bottom:8px}
  .home-ind{display:none!important}
}

/* ── iPhone 16 Pro Max shell ── */
/* Real: 430×932pt → scale to 390×845 */
.iphone{
  width:351px;
  background:#1a1a1c;
  border-radius:49px;
  padding:13px;
  box-shadow:
    0 0 0 1px #0d0d0f,
    0 0 0 2.5px #2e2e32,
    0 0 0 4px #0d0d0f,
    0 48px 120px rgba(0,0,0,.8),
    0 16px 40px rgba(0,0,0,.5);
  position:relative;flex-shrink:0;
}
/* power button right */
.iphone::before{content:'';position:absolute;right:-4px;top:130px;width:3.5px;height:72px;background:#2e2e32;border-radius:0 2px 2px 0}
/* silent + volume left */
.iphone::after{content:'';position:absolute;left:-4px;top:108px;width:3.5px;height:32px;background:#2e2e32;border-radius:2px 0 0 2px;box-shadow:0 46px 0 #2e2e32,0 88px 0 #2e2e32}

/* Dynamic Island */
.di{background:#000;width:120px;height:34px;border-radius:20px;margin:0 auto 6px;flex-shrink:0}

/* Screen — 362×786 visible area */
.screen{
  background:#f2f2f7;
  border-radius:42px;
  overflow:hidden;
  display:flex;flex-direction:column;
  height:620px;
  position:relative;
}
.screen-inner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
}
.screen-inner.anim-enter{animation:senter .28s ease}
.screen-inner.anim-back{animation:sback .28s ease}

/* status bar */
.sbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px 6px;font-weight:600;font-size:15px;color:#000;
  flex-shrink:0;background:#f2f2f7;
}
.sicons{display:flex;align-items:center;gap:5px}

/* nav bar */
.navbar{
  display:flex;align-items:center;
  padding:6px 16px 8px;
  background:#f2f2f7;
  border-bottom:.5px solid rgba(0,0,0,.15);
  flex-shrink:0;min-height:44px;position:relative;
}
.nb-back{color:var(--accent);font-size:17px;cursor:pointer;display:flex;align-items:center;gap:3px;user-select:none;position:absolute;left:10px}
.nb-back svg{width:9px;height:15px}
.nb-title{font-size:17px;font-weight:600;color:#000;flex:1;text-align:center}

/* ── List view ── */
.list-view{flex:1;overflow-y:auto;background:#f2f2f7}
.list-view::-webkit-scrollbar{display:none}
.lv-section-title{font-size:13px;font-weight:400;color:var(--text2);padding:18px 20px 6px;letter-spacing:-.01em}
.lv-card{background:#fff;border-radius:12px;margin:0 16px 10px;overflow:hidden}
.lv-row{
  display:flex;align-items:center;padding:11px 12px 11px 16px;
  border-bottom:.5px solid rgba(0,0,0,.07);cursor:pointer;gap:12px;
  transition:background .1s;
}
.lv-row:last-child{border-bottom:none}
.lv-row:active{background:#e8e8ed}
.lv-icon{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;letter-spacing:-.3px;
}
.lv-text{flex:1;min-width:0}
.lv-title{font-size:16px;color:#000;line-height:1.2}
.lv-sub{font-size:12px;color:var(--text3);margin-top:2px}
.lv-chevron{color:#c7c7cc;font-size:18px;font-weight:300;flex-shrink:0}
.lv-footer{background:#fff;padding:4px 16px 12px;display:flex;justify-content:flex-end;border-top:none}
.lv-footer-btn{font-size:13px;color:var(--accent);cursor:pointer;background:transparent;border:none;font-family:var(--font);display:flex;align-items:center;gap:6px;font-weight:400}
.lv-footer-btn:active{opacity:.5}

/* ── Keyboard view ── */
.kbd-view{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.kv-field{flex:1;padding:14px 18px 8px;overflow:hidden}
.kv-label{font-size:13px;color:#8e8e93;margin-bottom:4px}
.kv-text{font-size:17px;color:#000;line-height:1.4;word-break:break-all;min-height:24px}
.kv-text::after{content:'|';animation:blink 1s step-end infinite;color:var(--accent)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* keyboard */
.kbd{background:#cdd1d6;display:flex;flex-direction:column;gap:8px;padding:8px 3px 4px;flex-shrink:0}
.kr{display:flex;justify-content:center;gap:6px;padding:0 4px}
.k{
  flex:1;min-width:0;height:46px;background:#fff;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#000;cursor:pointer;
  box-shadow:0 1px 0 1.5px #888f97;
  font-family:var(--font);font-weight:400;
  position:relative;transition:background .06s;overflow:visible;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.k.sp{background:#acb3bc;box-shadow:0 1px 0 1.5px #717880}
.k.sp{font-size:14px}
.k.wide{flex:1.5}.k.k123{flex:1.4;font-size:14px}.k.ksp{flex:4.5;font-size:15px;color:#3c3c3e}.k.kret{flex:1.4;font-size:13px}.k.kpct{flex:1.5;font-weight:500;font-size:12px}
.k.kon{background:#fff;outline:1.5px solid var(--accent);color:var(--accent)}
.k.pressed{background:#a8b0b9!important;box-shadow:none!important}
.k.sp.pressed{background:#8e969e!important}
.lph{position:absolute;top:3px;right:4px;font-size:11px;font-weight:500;line-height:1;color:#4ea5f0;pointer-events:none}

/* home indicator */
.home-ind{height:34px;background:#cdd1d6;display:flex;align-items:center;justify-content:center;border-radius:0 0 42px 42px;flex-shrink:0}
.home-ind div{width:130px;height:5px;background:rgba(0,0,0,.25);border-radius:3px}

/* longpress popup */
.lpp{position:fixed;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);border:.5px solid rgba(0,0,0,.1);display:flex;gap:2px;padding:4px;z-index:999;white-space:nowrap}
.lpo{min-width:40px;height:46px;display:flex;align-items:center;justify-content:center;font-size:19px;border-radius:7px;cursor:pointer;padding:0 8px;transition:background .08s;color:#000}
.lpo:hover,.lpo.sel{background:var(--accent);color:#fff}
.lpo.orig{font-weight:600}

/* slide transitions — handled by .screen-inner.anim-enter / .anim-back */
@keyframes senter{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes sback {from{transform:translateX(-30%)}to{transform:translateX(0)}}

/* ── macOS modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;max-width:360px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden;animation:modalUp .25s ease}
.modal.modal-wide{max-width:940px}
@keyframes modalUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{padding:18px 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:.5px solid rgba(0,0,0,.08)}
.modal-hdr svg{flex-shrink:0}
.modal-hdr-text{flex:1}
.modal-hdr h3{font-size:17px;font-weight:600;color:#000;margin:0}
.modal-hdr p{font-size:13px;color:#8e8e93;margin:2px 0 0}
.modal-close{width:28px;height:28px;background:#e8e8ed;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:#6c6c70;flex-shrink:0;border:none}
.modal-close:hover{background:#d8d8dc}
.modal-body{padding:16px 20px 20px}
.modal-dl{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.modal-dl a{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f2f2f7;border-radius:10px;text-decoration:none;color:#000;font-size:15px;transition:background .1s}
.modal-dl a:hover{background:#e8e8ed}
.modal-dl a svg{flex-shrink:0;color:var(--accent)}
.modal-dl a span{flex:1}
.modal-dl a .dl-size{font-size:12px;color:#8e8e93}
.modal-steps{font-size:13px;color:#6c6c70;line-height:1.5}
.modal-steps b{color:#3c3c3e;font-weight:600}
.modal-steps ol{margin:8px 0 0;padding-left:20px}
.modal-steps li{margin-bottom:6px}
.modal-steps code{background:#f2f2f7;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}

/* macOS badge in list */
.lv-macos{display:flex;align-items:center;gap:4px;padding:3px 8px;background:#f2f2f7;border-radius:6px;font-size:11px;color:#6c6c70;cursor:pointer;flex-shrink:0;border:none;font-family:var(--font);transition:background .1s}
.lv-macos:hover{background:#e0e0e5}
.lv-macos svg{width:14px;height:14px}
.cmd-list{padding:0 20px 20px}
.cmd-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid rgba(0,0,0,.05);align-items:baseline}
.cmd-row:last-child{border-bottom:none}
.cmd-row span{color:#8e8e93;font-size:13px;text-transform:capitalize}
.cmd-row b{font-weight:500;font-size:16px;color:#000}
.empty{text-align:center;padding:20px;color:#8e8e93}
</style>
</head>
<body>
<div class="iphone">
  <div class="di"></div>
  <div class="screen" id="screen">
    <!-- filled by JS -->
  </div>
</div>

<script>
const LP=/*BUILD_LP*/{};

const DATA=/*BUILD_DATA*/[];


const SYM123_DEFAULT=[['1','2','3','4','5','6','7','8','9','0'],['-','/',':',';','(',')','$','&','@','"'],['.',',','?','!','\'']];
const SYMPUNCT_DEFAULT=[['[',']','{','}','#','%','^','*','+','='],['_','\\','|','~','<','>','€','£','¥','•'],['.',',','?','!','\'']];
function getSym123(){ return (curL&&curL.sym1) ? curL.sym1.slice(0,3) : SYM123_DEFAULT; }
function getSymPunct(){ return (curL&&curL.sym2) ? curL.sym2.slice(0,3) : SYMPUNCT_DEFAULT; }

let ST={isShift:false,isSym:false,isPunct:false};
let lpTimer=null,lpEl=null,lpPop=null,lpIdx=-1,lpWasShown=false;
let curL=null,curLang=null;
let listScrollY=0;
const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const SISVG=`<svg width="16" height="11" viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx=".5" fill="#000"/><rect x="4.5" y="2" width="3" height="10" rx=".5" fill="#000"/><rect x="9" y=".5" width="3" height="11.5" rx=".5" fill="#000"/><rect x="13.5" y="0" width="3" height="12" rx=".5" fill="#000" opacity=".3"/></svg><svg width="15" height="11" viewBox="0 0 16 12" fill="none"><path d="M8 2.4C10.2 2.4 12.2 3.3 13.6 4.8L15 3.3C13.2 1.3 10.7 0 8 0S2.8 1.3 1 3.3L2.4 4.8C3.8 3.3 5.8 2.4 8 2.4Z" fill="#000"/><path d="M8 5c1.5 0 2.8.6 3.8 1.6l1.4-1.5C11.8 3.8 10 3 8 3S4.2 3.8 2.8 5.1L4.2 6.6C5.2 5.6 6.5 5 8 5Z" fill="#000"/><circle cx="8" cy="10" r="2" fill="#000"/></svg><svg width="25" height="11" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#000" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#000"/><path d="M23 4.5v3c.8-.3 1.5-1 1.5-1.5s-.7-1.2-1.5-1.5Z" fill="#000" opacity=".4"/></svg>`;

function now(){return new Date().getHours()+':'+String(new Date().getMinutes()).padStart(2,'0')}

function sbar(){
  return `<div class="sbar"><span>${now()}</span><div class="sicons">${SISVG}</div></div>`;
}

// ── macOS SVGs ──
const MACOS_ICON=`<svg viewBox="0 0 16 16" fill="none" width="14" height="14"><path d="M12.5 2H3.5C2.67 2 2 2.67 2 3.5v7C2 11.33 2.67 12 3.5 12h9c.83 0 1.5-.67 1.5-1.5v-7C14 2.67 13.33 2 12.5 2ZM13 10.5c0 .28-.22.5-.5.5h-9c-.28 0-.5-.22-.5-.5v-7c0-.28.22-.5.5-.5h9c.28 0 .5.22.5.5v7ZM10 13H6l-.5 1h5l-.5-1Z" fill="currentColor"/></svg>`;
const DL_ICON=`<svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M8 1v8.5M8 9.5L5 6.5M8 9.5l3-3M3 11v2h10v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TRANSLATE_ICON=`<svg viewBox="0 0 16 16" fill="none" width="14" height="14"><path d="M2.5 4h7M4.5 2v2M4.5 4c0 2 1 3.5 2.5 4.5M8.5 4C8.5 6 7.5 7.5 6 8.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 14l2.5-6h1L14 14M9 12h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const KEYLAYOUT_BASE='keylayout/';

function buildMacKeyboardSVG(defaultRows, altRows) {
  if (!defaultRows || defaultRows.length < 4 || !altRows || altRows.length < 4) return '';
  
  const keyW = 54, keyH = 54, gap = 6, padX = 16, padY = 16;
  const chassisW = 896, chassisH = 266;
  const outer = 8;
  const svgW = chassisW + outer * 2;
  const svgH = chassisH + outer * 2;
  
  let keysSvg = '';
  
  function drawKey(x, y, w, h, main, opt, isFunc) {
    const fill = isFunc ? 'url(#f-grd)' : 'url(#k-grd)';
    const textCol = isFunc ? '#8e8e9f' : '#ffffff';
    const optCol = '#ff9f0a';
    
    let labelXml = '';
    if (isFunc) {
      let t_x = x + 10;
      let t_y = y + h/2 + 4;
      let align = 'start';
      if (main === 'return' || main === 'delete') {
        align = 'end';
        t_x = x + w - 10;
      }
      labelXml = `<text x="${t_x}" y="${t_y}" fill="${textCol}" font-size="11" font-weight="500" text-anchor="${align}">${main}</text>`;
    } else {
      const m_x = x + 12;
      const m_y = y + h - 12;
      labelXml = `<text x="${m_x}" y="${m_y}" fill="${textCol}" font-size="15" font-weight="600">${main.toUpperCase()}</text>`;
      if (opt && opt !== main) {
        const o_x = x + w - 10;
        const o_y = y + 18;
        let optStr = opt.toUpperCase();
        if (optStr === '&') optStr = '&amp;';
        else if (optStr === '<') optStr = '&lt;';
        else if (optStr === '>') optStr = '&gt;';
        labelXml += `<text x="${o_x}" y="${o_y}" fill="${optCol}" font-size="10.5" font-weight="bold" text-anchor="end">${optStr}</text>`;
      }
    }
    
    return `
      <g>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="#111116" stroke-width="1.5" filter="url(#k-sh)"/>
        <rect x="${x+1}" y="${y+1}" width="${w-2}" height="${h-2}" rx="5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
        ${labelXml}
      </g>`;
  }
  
  // Row 1 (Numbers)
  let cy = padY + outer;
  let cx = padX + outer;
  for (let i = 0; i < 13; i++) {
    keysSvg += drawKey(cx, cy, keyW, keyH, defaultRows[0][i] || '', altRows[0][i] || '', false);
    cx += keyW + gap;
  }
  keysSvg += drawKey(cx, cy, 84, keyH, 'delete', '', true);
  
  // Row 2 (QWERTY)
  cy += keyH + gap;
  cx = padX + outer;
  keysSvg += drawKey(cx, cy, 84, keyH, 'tab', '', true);
  cx += 84 + gap;
  for (let i = 0; i < 13; i++) {
    keysSvg += drawKey(cx, cy, keyW, keyH, defaultRows[1][i] || '', altRows[1][i] || '', false);
    cx += keyW + gap;
  }
  
  // Row 3 (ASDF)
  cy += keyH + gap;
  cx = padX + outer;
  keysSvg += drawKey(cx, cy, 102, keyH, 'caps lock', '', true);
  cx += 102 + gap;
  for (let i = 0; i < 11; i++) {
    keysSvg += drawKey(cx, cy, keyW, keyH, defaultRows[2][i] || '', altRows[2][i] || '', false);
    cx += keyW + gap;
  }
  keysSvg += drawKey(cx, cy, 102, keyH, 'return', '', true);
  
  // Row 4 (ZXCV)
  cy += keyH + gap;
  cx = padX + outer;
  keysSvg += drawKey(cx, cy, 134, keyH, 'shift', '', true);
  cx += 134 + gap;
  for (let i = 0; i < 10; i++) {
    keysSvg += drawKey(cx, cy, keyW, keyH, defaultRows[3][i] || '', altRows[3][i] || '', false);
    cx += keyW + gap;
  }
  keysSvg += drawKey(cx, cy, 130, keyH, 'shift', '', true);
  
  return `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${svgW} ${svgH}" width="100%" height="auto" style="border-radius:14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #16161a;">
      <defs>
        <filter id="k-sh" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
        <linearGradient id="k-grd" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#363643" />
          <stop offset="100%" stop-color="#282833" />
        </linearGradient>
        <linearGradient id="f-grd" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#282833" />
          <stop offset="100%" stop-color="#1d1d25" />
        </linearGradient>
      </defs>
      <rect x="${outer}" y="${outer}" width="${chassisW}" height="${chassisH}" rx="14" fill="#1b1b22" stroke="#2a2a35" stroke-width="2.5" filter="url(#k-sh)"/>
      <rect x="${outer+2}" y="${outer+2}" width="${chassisW-4}" height="${chassisH-4}" rx="12" fill="none" stroke="#0e0e12" stroke-width="1.5" opacity="0.8"/>
      <g>
        ${keysSvg}
      </g>
    </svg>`;
}

function showMacModal(langName,macosFiles){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  let bodyContent='';
  if(isMobile){
    bodyContent=`
      <div style="text-align:center;padding:8px 0 16px">
        <div style="font-size:40px;margin-bottom:10px">💻</div>
        <div style="font-size:15px;color:#000;font-weight:500;margin-bottom:6px">Откройте эту страницу на Mac</div>
        <div style="font-size:13px;color:#8e8e93;line-height:1.5">Скачать и установить раскладку<br>можно только на компьютере с macOS</div>
        <button onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='Скопировано ✓')" style="margin-top:14px;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-family:var(--font);cursor:pointer">Скопировать ссылку</button>
      </div>
      <div class="modal-steps" style="border-top:.5px solid rgba(0,0,0,.08);padding-top:14px">
        <b>На Mac:</b>
        <ol>
          <li>Откройте эту страницу</li>
          <li>Нажмите <b>macOS</b> у нужного языка</li>
          <li>Скачайте <code>.keylayout</code> файл</li>
          <li>Скопируйте в <code>~/Library/Keyboard Layouts/</code></li>
          <li><b>Системные настройки</b> → Клавиатура → Источники ввода → <b>+</b> → Другие</li>
        </ol>
      </div>`;
  } else {
    let dlLinks='';
    macosFiles.forEach(f=>{
      dlLinks+=`<a href="${KEYLAYOUT_BASE}${f.file}" download><svg viewBox="0 0 16 16" fill="none" width="16" height="16"><path d="M8 1v8.5M8 9.5L5 6.5M8 9.5l3-3M3 11v2h10v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${f.name}</span><span class="dl-size">.keylayout</span></a>`;
    });
    
    let kbdSvg = '';
    const firstMac = macosFiles[0];
    if (firstMac && firstMac.default && firstMac.alt) {
      kbdSvg = `<div class="modal-kbd-preview" style="margin-bottom:20px">${buildMacKeyboardSVG(firstMac.default, firstMac.alt)}</div>`;
    }
    
    bodyContent=`
      ${kbdSvg}
      <div class="modal-bottom-row" style="display:flex;gap:24px;flex-wrap:wrap">
        <div style="flex:1;min-width:250px">
          <h4 style="margin:0 0 10px;font-size:14px;font-weight:600;color:#000">Файлы раскладок для загрузки:</h4>
          <div class="modal-dl" style="margin-bottom:0">${dlLinks}</div>
        </div>
        <div class="modal-steps" style="flex:1.5;min-width:300px">
          <b>Установка:</b>
          <ol>
            <li>Скачайте файл <code>.keylayout</code></li>
            <li>Скопируйте в <code>~/Library/Keyboard Layouts/</code></li>
            <li>Перезагрузите Mac или выйдите из сессии</li>
            <li><b>Системные настройки</b> → Клавиатура → Источники ввода → <b>+</b> → Другие</li>
          </ol>
          <b>Или через Терминал:</b><br>
          <code style="display:block;margin-top:6px;padding:8px;background:#1c1c1e;color:#98c379;border-radius:6px;font-size:11px;line-height:1.6;word-break:break-all">cp ~/Downloads/*.keylayout ~/Library/Keyboard\\ Layouts/</code>
        </div>
      </div>`;
  }
  ov.innerHTML=`<div class="modal ${!isMobile ? 'modal-wide' : ''}">
    <div class="modal-hdr">
      ${MACOS_ICON.replace('width="14" height="14"','width="24" height="24"')}
      <div class="modal-hdr-text"><h3>${langName}</h3><p>Раскладка для macOS</p></div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body">${bodyContent}</div>
  </div>`;
  document.body.appendChild(ov);
}

function showCommandModal(langName,keyNames){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  
  const rows=[];
  const add=(k,v)=>{
    if(!v) return;
    if(typeof v==='object'){
      Object.entries(v).forEach(([subK,subV])=>add(`${k} (${subK})`,subV));
    } else {
      rows.push(`<div class="cmd-row"><span>${k}</span><b>${v}</b></div>`);
    }
  };
  Object.entries(keyNames).forEach(([k,v])=>add(k,v));

  ov.innerHTML=`<div class="modal">
    <div class="modal-hdr">
      <div class="modal-hdr-text"><h3>${langName}</h3><p>Перевод команд</p></div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body cmd-list">${rows.join('')||'<p class="empty">Нет данных</p>'}</div>
  </div>`;
  document.body.appendChild(ov);
}

// ── List screen ──────────────────────────────────────────────────────────────
function showList(anim){
  const sc=document.getElementById('screen');
  const cls=anim?'screen-inner anim-back':'screen-inner';
  let html=`<div class="${cls}">`;
  html+=sbar();
  html+=`<div class="navbar" style="display:flex;justify-content:space-between;align-items:center;padding-right:16px;"><div class="nb-title">Клавиатуры</div><a href="ldml-keyboards.html" style="font-size:13px;color:var(--accent);text-decoration:none;font-weight:600;background:rgba(0,122,255,0.1);padding:4px 10px;border-radius:12px;">LDML 3.0 ›</a></div>`;
  html+=`<div class="list-view">`;
  DATA.forEach(sec=>{
    html+=`<div class="lv-section-title">${sec.group}</div>`;
    sec.langs.forEach(lang=>{
      html+=`<div class="lv-card">`;
      lang.layouts.forEach((lay,li)=>{
        const isFirst=li===0;
        const macBtn=isFirst&&lang.macos?`<button class="lv-macos" onclick="event.stopPropagation();showMacModal('${lang.name.replace(/'/g,"\\'")}',${JSON.stringify(lang.macos).replace(/"/g,'&quot;')})">${MACOS_ICON} macOS</button>`:'';
        html+=`<div class="lv-row" onclick="openKbd('${sec.langs.indexOf(lang)}','${li}','${DATA.indexOf(sec)}')">
          ${isFirst?`<div class="lv-icon" style="background:${sec.color}">${lang.code}</div>`:'<div style="width:34px;flex-shrink:0"></div>'}
          <div class="lv-text">
            <div class="lv-title">${isFirst?lang.name:''}<span style="${isFirst?'color:#6c6c70;font-size:15px':''}">${isFirst&&lang.layouts.length>1?' · ':''}</span>${lang.layouts.length>1||!isFirst?'<span style="color:'+(isFirst?'#6c6c70':'#000')+'">'+lay.label+'</span>':''}</div>
            <div class="lv-sub">${isFirst?lang.native:lay.label}</div>
          </div>
          ${macBtn}
          <div class="lv-chevron">›</div>
        </div>`;
      });
      if(lang.keyNames && Object.keys(lang.keyNames).length > 0){
        html+=`<div class="lv-footer">
          <button class="lv-footer-btn" onclick="event.stopPropagation();showCommandModal('${lang.name.replace(/'/g,"\\'")}',${JSON.stringify(lang.keyNames).replace(/"/g,'&quot;')})">
            Перевод команд ${TRANSLATE_ICON}
          </button>
        </div>`;
      }
      html+=`</div>`;
    });
  });
  html+=`</div></div>`;
  sc.innerHTML=html;
  setTimeout(()=>{const si=sc.querySelector('.screen-inner');if(si)si.classList.remove('anim-back');const lv=sc.querySelector('.list-view');if(lv&&listScrollY)lv.scrollTop=listScrollY},anim?10:0);
}

function openKbd(langIdx,layIdx,secIdx){
  const lv=document.querySelector('.list-view');
  if(lv) listScrollY=lv.scrollTop;
  const sec=DATA[parseInt(secIdx)];
  const lang=sec.langs[parseInt(langIdx)];
  const lay=lang.layouts[parseInt(layIdx)];
  curL=lay;curLang=lang;
  ST={isShift:false,isSym:false,isPunct:false};
  showKbd(sec.color);
}

// ── Keyboard screen ──────────────────────────────────────────────────────────
function showKbd(color){
  const sc=document.getElementById('screen');
  const backChev=`<svg viewBox="0 0 9 15" fill="none" width="9" height="15"><path d="M7.5 1L1 7.5L7.5 14" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  sc.innerHTML=`<div class="screen-inner anim-enter">
    ${sbar()}
    <div class="navbar">
      <div class="nb-back" onclick="showList(true)">${backChev} Языки</div>
      <div class="nb-title">${curLang.name}</div>
    </div>
    <div class="kbd-view">
      <div class="kv-field">
        <div class="kv-label">${curL.label}</div>
        <div class="kv-text" id="sft"></div>
      </div>
      <div class="kbd" id="kbd"></div>
      <div class="home-ind"><div></div></div>
    </div></div>`;
  setTimeout(()=>{const si=sc.querySelector('.screen-inner');if(si)si.classList.remove('anim-enter')},300);
  renderKbd();
}

// ── Keyboard render ──────────────────────────────────────────────────────────
function lpO(ch){const v=(LP[curL.id]||{})[ch];return v?v.trim().split(/\s+/).filter(Boolean):[]}

function renderKbd(){
  const kbd=document.getElementById('kbd');if(!kbd)return;kbd.innerHTML='';
  const R=()=>{const d=document.createElement('div');d.className='kr';return d};

  const parseT=t=>{
    if(!t.startsWith('\\s{')) return {type:'key',lbl:t,act:t};
    const m=t.match(/\\s\{([^}:]+)(?::([^}]+))?\}/);
    if(!m) return {type:'key',lbl:t,act:t};
    const type=m[1], val=m[2], w=parseFloat(val);
    if(type==='spacer') return {type:'spc',w:w||1};
    if(type==='shift') return {type:'sh',w:w||1.5,lbl:'⇧'};
    if(type==='backspace') return {type:'del',w:w||1.5,lbl:'⌫'};
    if(type==='return') return {type:'ret',w:w||1.5,lbl:curL.ret||'Giriş'};
    if(type==='tab') return {type:'key',w:w||1.5,lbl:'⇥',act:''};
    if(type==='caps') return {type:'key',w:w||1.75,lbl:'⇪',act:''};
    if(type==='shiftSymbols'||type==='#+=') return {type:'s123',w:w||1.5,lbl:ST.isPunct?'123':'#+='};
    return {type:'key',lbl:t,act:t};
  };

  function key(item,rowW){
    const k=document.createElement('div');
    k.className='k';
    if(item.type==='spc'){
      k.style.visibility='hidden';k.style.pointerEvents='none';k.style.boxShadow='none';k.style.background='transparent';
    } else {
      k.textContent=item.lbl;
      if(item.type!=='key') k.classList.add('sp');
      if(item.type==='sh' && ST.isShift) k.classList.add('kon');
    }

    const w=item.w||1;
    k.style.flex=w;

    if(item.type==='key'){
      const opts=lpO(item.act);
      if(opts.length){const h=document.createElement('span');h.className='lph';h.textContent=opts.length===1?opts[0]:'•';k.appendChild(h)}
      k.addEventListener('click',e=>{e.stopPropagation();if(!lpPop&&!lpWasShown&&!opts.length)doKey(item.act,k);lpWasShown=false});
      if(opts.length){
        k.addEventListener('mousedown',e=>{e.preventDefault();startLp(e.clientX,e.clientY,k,item.act,opts)});
        k.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];startLp(t.clientX,t.clientY,k,item.act,opts)},{passive:false});
      }
    } else {
      const acts={sh:'__sh',del:'__del',ret:'__ret',s123:'__pct'};
      if(acts[item.type]) k.addEventListener('click',e=>{e.stopPropagation();doKey(acts[item.type],k)});
    }
    return k;
  }

  if(ST.isSym||ST.isPunct){
    const d=ST.isPunct?getSymPunct():getSym123();
    d.forEach(rowData=>{
      const r=R();
      rowData.forEach(c=>r.appendChild(key(parseT(c))));
      kbd.appendChild(r);
    });
    const r4=R();
    r4.appendChild(key({type:'key',lbl:(curL.abc||'АБВ'),act:'__abc',w:1.4}));
    r4.appendChild(key({type:'key',lbl:curL.space,act:'__sp',w:4.5}));
    r4.appendChild(key({type:'ret',lbl:curL.ret,w:1.4}));
    kbd.appendChild(r4);
  } else {
    const rows=ST.isShift?curL.shift:curL.rows;
    // Calculate total flex width of each row to find max
    const rowInfos=rows.map(r=>r.map(parseT));
    const rowWidths=rowInfos.map(ri=>ri.reduce((a,b)=>a+(b.w||1),0));
    const maxW=Math.max(...rowWidths);

    rowInfos.forEach((ri,i)=>{
      const r=R();
      ri.forEach(it=>r.appendChild(key(it)));
      kbd.appendChild(r);
    });
    const r4=R();
    r4.appendChild(key({type:'key',lbl:'123',act:'__sym',w:1.4}));
    r4.appendChild(key({type:'key',lbl:curL.space,act:'__sp',w:4.5}));
    r4.appendChild(key({type:'ret',lbl:curL.ret,w:1.4}));
    kbd.appendChild(r4);
  }
}

function doKey(a,el){
  el&&el.classList.add('pressed');setTimeout(()=>el&&el.classList.remove('pressed'),80);
  if(!a)return;
  if(a==='__sh'){ST.isShift=!ST.isShift;renderKbd();return}
  if(a==='__del'){
    const t=document.getElementById('sft');if(!t)return;
    const last=t.lastChild;
    if(last){
      if(last.nodeName==='BR'){t.removeChild(last);const z=t.lastChild;if(z&&z.nodeValue==='\u200b')t.removeChild(z);}
      else if(last.nodeType===3&&last.nodeValue.length>1){last.nodeValue=last.nodeValue.slice(0,-1);}
      else{t.removeChild(last);}
    }
    return
  }
  if(a==='__sym'){ST.isSym=true;ST.isPunct=false;renderKbd();return}
  if(a==='__s123'){ST.isSym=true;ST.isPunct=false;renderKbd();return}
  if(a==='__pct'){ST.isSym=true;ST.isPunct=!ST.isPunct;renderKbd();return}
  if(a==='__abc'){ST.isSym=false;ST.isPunct=false;renderKbd();return}
  if(a==='__sp'){type(' ');return}
  if(a==='__ret'){type('\n');return}
  type(a);
}

function type(ch){
  const el=document.getElementById('sft');if(!el)return;
  if(ch==='\n'){el.innerHTML+='\u200b<br>';} else {el.appendChild(document.createTextNode(ch));}
  if(ST.isShift&&ch!==' '){ST.isShift=false;renderKbd()}
}

// ── Longpress ────────────────────────────────────────────────────────────────
function startLp(x,y,keyEl,origCh,opts){
  lpEl=keyEl;
  lpTimer=setTimeout(()=>showLp(keyEl,origCh,opts),380);
  function mv(cx,cy){
    if(!lpPop)return;
    const its=lpPop.querySelectorAll('.lpo');let f=-1;
    its.forEach((it,i)=>{const r=it.getBoundingClientRect();if(cx>=r.left-6&&cx<=r.right+6&&cy>=r.top-14&&cy<=r.bottom+14)f=i});
    its.forEach((it,i)=>it.classList.toggle('sel',i===f));lpIdx=f;
  }
  function up(cx,cy){
    clearTimeout(lpTimer);lpTimer=null;cleanup();
    if(lpPop){mv(cx,cy);const all=[origCh,...opts];type(lpIdx>=0?all[lpIdx]:origCh);hideLp();lpWasShown=true}
    else{doKey(origCh,keyEl)}
  }
  const onMM=e=>mv(e.clientX,e.clientY);
  const onMU=e=>up(e.clientX,e.clientY);
  const onTM=e=>{e.preventDefault();const t=e.touches[0];mv(t.clientX,t.clientY)};
  const onTE=e=>{const t=e.changedTouches[0];up(t.clientX,t.clientY)};
  function cleanup(){document.removeEventListener('mousemove',onMM);document.removeEventListener('mouseup',onMU);document.removeEventListener('touchmove',onTM);document.removeEventListener('touchend',onTE)}
  document.addEventListener('mousemove',onMM);document.addEventListener('mouseup',onMU);document.addEventListener('touchmove',onTM,{passive:false});document.addEventListener('touchend',onTE);
}
function showLp(keyEl,origCh,opts){
  if(lpPop)return;lpWasShown=true;keyEl.classList.add('pressed');
  const pop=document.createElement('div');pop.className='lpp';lpPop=pop;
  [origCh,...opts].forEach((ch,i)=>{const o=document.createElement('div');o.className='lpo'+(i===0?' orig':'');o.textContent=ch;pop.appendChild(o)});
  document.body.appendChild(pop);
  const r=keyEl.getBoundingClientRect(),pw=pop.offsetWidth;
  let left=r.left+r.width/2-pw/2;
  if(left<8)left=8;if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  pop.style.left=left+'px';pop.style.top=(r.top-pop.offsetHeight-8)+'px';
}
function hideLp(){if(lpPop){lpPop.remove();lpPop=null}if(lpEl){lpEl.classList.remove('pressed');lpEl=null}lpIdx=-1}

showList(false);
</script>
