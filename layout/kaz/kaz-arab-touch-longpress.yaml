# kaz-arab-touch-longpress.yaml
# Долгое нажатие для International Touch: ح → ھ + пунктуация

ح: ['ھ']

# Символы и пунктуация
'.': ['…']
'؟': ['?', '¿']
'!': ['¡']
'0': ['°']
'-': ['–', '—', '•']
'%': ['‰']
'=': ['≠', '≈']
'(': ['[', '{']
')': [']', '}']
'"': ['”', '“', '„']
'&': ['§']
'/': ['\\']
